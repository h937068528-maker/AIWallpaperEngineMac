<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Wallpaper 网页壁纸测试</title>
  <style>
    * { box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #030914; color: rgba(210,245,255,.84); font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    #hud { position: fixed; left: 28px; bottom: 26px; pointer-events: none; letter-spacing: .12em; text-transform: uppercase; }
    #hud b { display: block; color: #74ecff; font-size: 15px; margin-bottom: 6px; }
    #hint { opacity: .55; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud"><b>AI Wallpaper</b><span id="hint">move · attract · click · pulse</span></div>
  <script>
    (() => {
      const canvas = document.querySelector('#scene');
      const context = canvas.getContext('2d');
      const pointer = { x: -9999, y: -9999, down: false };
      let width = 0, height = 0, scale = 1, last = performance.now(), pulse = 0;
      const particles = Array.from({ length: 420 }, () => ({
        x: Math.random(), y: Math.random(), px: 0, py: 0,
        vx: (Math.random() - .5) * .12, vy: (Math.random() - .5) * .12,
        size: Math.random() * 1.9 + .45, phase: Math.random() * Math.PI * 2
      }));

      function resize() {
        scale = Math.min(devicePixelRatio || 1, 2);
        width = innerWidth; height = innerHeight;
        canvas.width = width * scale; canvas.height = height * scale;
        context.setTransform(scale, 0, 0, scale, 0, 0);
      }
      addEventListener('resize', resize); resize();
      addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
      addEventListener('pointerdown', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = true; pulse = 1; });
      addEventListener('pointerup', () => { pointer.down = false; });

      function frame(now) {
        const dt = Math.min((now - last) / 1000, .04); last = now;
        const background = context.createRadialGradient(pointer.x, pointer.y, 0, width * .5, height * .5, Math.max(width, height));
        background.addColorStop(0, '#0d3650'); background.addColorStop(.36, '#061426'); background.addColorStop(1, '#020711');
        context.fillStyle = background; context.fillRect(0, 0, width, height);
        context.globalCompositeOperation = 'lighter';
        for (const p of particles) {
          const targetX = p.x * width, targetY = p.y * height;
          const dx = pointer.x - p.px, dy = pointer.y - p.py;
          const distance = Math.hypot(dx, dy) || 1;
          const force = Math.max(0, 1 - distance / 230) * (pointer.down ? -1700 : 820);
          p.vx += (targetX - p.px) * dt * .16 + dx / distance * force * dt;
          p.vy += (targetY - p.py) * dt * .16 + dy / distance * force * dt;
          p.vx *= .965; p.vy *= .965; p.px += p.vx * dt; p.py += p.vy * dt;
          const alpha = .3 + Math.sin(now * .002 + p.phase) * .18;
          context.fillStyle = `rgba(86, 229, 255, ${alpha})`;
          context.beginPath(); context.arc(p.px, p.py, p.size, 0, Math.PI * 2); context.fill();
        }
        if (pulse > .01) {
          const radius = (1 - pulse) * 430; context.strokeStyle = `rgba(122,239,255,${pulse * .65})`;
          context.lineWidth = 2; context.beginPath(); context.arc(pointer.x, pointer.y, radius, 0, Math.PI * 2); context.stroke(); pulse *= .94;
        }
        context.globalCompositeOperation = 'source-over'; requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
